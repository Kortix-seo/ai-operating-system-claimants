# What each "AI operating system" claimant says about itself.
# Every entry quotes the vendor's own page. Re-check with: python3 check.py
# last_checked: 2026-10-24
claimants:
  - name: Cloudflare OS
    page: https://github.com/cloudflare/cloudflare-os
    launch_post: https://blog.cloudflare.com/cloudflare-os
    calls_itself: "an operating system for AI productivity"
    open_source_claim: true
    quote: "We are making Cloudflare OS open source so that others can copy it and customize it for their own company."
    production_path: "deploy to your Cloudflare account"
    status: "version 2, early access, August 2026 rewrite"
  - name: Red Hat AI OS
    page: https://www.redhat.com/en/blog/developing-standard-ai-os
    calls_itself: "a standard AI operating system (AI OS)"
    open_source_claim: true
    quote: "Built on open source technology"
    production_path: "a standardized AI layer on existing open-source infrastructure"
    status: "a vendor position in a blog post, not a separate product download"
  - name: VAST AI OS
    page: https://www.vastdata.com/platform/ai-os
    calls_itself: "The VAST AI Operating System"
    open_source_claim: false
    quote: "The VAST AI OS pulls all of it into a single unified infrastructure layer."
    production_path: "a data and inference platform sold by the vendor"
    status: "product page"
  - name: Xyne
    page: https://2026.allthingsopen.org/ai-operating-system-for-organizations-built-the-unix-way
    calls_itself: "an open-source operating system for organizations"
    open_source_claim: true
    quote: "an open-source operating system for organizations"
    production_path: "on infrastructure the organization controls"
    status: "All Things Open 2026 community post"
  - name: OpenFang
    page: https://raw.githubusercontent.com/RightNow-AI/openfang/main/README.md
    calls_itself: "The Agent Operating System"
    open_source_claim: true
    quote: "Open-source Agent OS built in Rust."
    production_path: "one binary, installed on the operator's machine"
    status: "v0.6.9, published 12 May 2026; the project still calls itself pre-1.0"
  - name: Paperclip
    page: https://raw.githubusercontent.com/paperclipai/paperclip/master/README.md
    calls_itself: "the app people use to manage AI agents for work"
    open_source_claim: true
    quote: "Paperclip is the app people use to manage AI agents for work."
    production_path: "a Node.js server and React UI you run; a cloud edition sits on a waitlist"
    status: "MIT, repository active in October 2026"
  - name: taOS
    page: https://taos.my
    repo: https://github.com/jaylfc/taOS
    calls_itself: "the self-hosted AI agent operating system"
    open_source_claim: false
    quote: "Source-available, append-only storage"
    production_path: "install on hardware you own; cloud models are opt-in"
    status: "v1.0.0-beta.56, 15 October 2026, still beta; repository licence AGPL-3.0"
  - name: Klawty
    page: https://klawty.ai
    repo: https://github.com/dcode-tec/Klawty
    calls_itself: "The AI Agent Operating System"
    open_source_claim: true
    quote: "Open-source AI agent operating system with enterprise security."
    production_path: "install script on your own machine, Docker available; a hardened fork of OpenClaw"
    status: "site advertises v1.4.0; the public repository has no release or tag, last push 19 June 2026"
  - name: SanctumOS
    page: https://sanctumos.org
    calls_itself: "The Modular, Self-Hosted Agentic Operating System"
    open_source_claim: false
    quote: "self-hosted agentic OS"
    production_path: "deploy the modules on your own infrastructure, following the module docs"
    status: "version 1.2 in its own structured data, latest post 13 October 2026; module repositories report no recognised licence"
  - name: CorvinOS
    page: https://raw.githubusercontent.com/CorvinLabs/CorvinOS/main/README.md
    repo: https://github.com/CorvinLabs/CorvinOS
    calls_itself: "The operating system for AI work"
    open_source_claim: true
    quote: "The operating system for AI work."
    production_path: "installer script clones the repository and runs it locally, console on 127.0.0.1:8765"
    status: "v2.0.0, release tag tier1-complete 18 September 2026, repository active; Apache-2.0"
  - name: Microsoft Project Solara
    page: https://commandline.microsoft.com/project-solara-build-2026/
    calls_itself: "a chip-to-cloud platform ... designed from the ground up for agent-first experiences"
    open_source_claim: false
    quote: "a chip-to-cloud platform, codenamed Project Solara"
    production_path: "devices built by hardware partners on MDEP, managed with Intune and Entra ID, with cloud agents loaded through an Agent Shell"
    status: "Build 2026 preview, June 2026; Microsoft says it will not ship the devices itself"
  - name: Trinity
    page: https://www.ability.ai/trinity
    repo: https://github.com/Abilityai/trinity
    calls_itself: "the open-source (Apache 2.0) operating system for your company's AI"
    open_source_claim: true
    quote: "It is a self-hosted AI agent platform to run agents in production"
    production_path: "on hardware you own (a workstation, a rack, a VM behind your VPN), or the one-click DigitalOcean / AWS Marketplace image; agents run Claude Code, Codex or Gemini CLI inside the perimeter"
    status: "v1.0.0 (the Tandem release), 20 October 2026, Apache-2.0, repository active"
